<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Basic Form Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f6f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }

        label {
            font-size: 16px;
            color: #444;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.2s;
        }

        textarea {
            height: 70px;
            resize: none;
        }

        input:focus,
        textarea:focus {
            border-color: #4b8df7;
            box-shadow: 0 0 5px rgba(75, 141, 247, 0.4);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #4b8df7;
            color: white;
            font-size: 17px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.3s;
        }

        button:hover {
            background: #3b78d4;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Basic Form</h1>

        <label for="nameInput">Name:</label>
        <input id="nameInput" type="text" />

        <label for="emailInput">Email:</label>
        <input id="emailInput" type="email" />

        <label for="ageInput">Age:</label>
        <input id="ageInput" type="number" />

        <label for="addressInput">Address:</label>
        <textarea id="addressInput"></textarea>

        <button id="submitBtn">Submit</button>
    </div>

    <script>

        function emailCheck(email) {
            // Check if email ends with @gmail.com
            if (email.endsWith("@gmail.com")) {
                alert("Valid Email Format!");
            } else {
                alert("Invalid Email: must end with @gmail.com");
            }
        }

        document.getElementById("submitBtn").addEventListener("click", function () {
            let emailValue = document.getElementById("emailInput").value;
            emailCheck(emailValue);
        });

    </script>

</body>

</html>
